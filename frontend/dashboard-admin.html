<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Admin Dashboard - Clinic</title>
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
</head>
<body>
  <header class="header fixed-top" style="position:relative">
    <div class="branding d-flex align-items-center py-3">
      <div class="container d-flex align-items-center justify-content-between">
        <a href="index.html" class="logo d-flex align-items-center"><h1 class="sitename">Clinic</h1></a>
        <nav></nav>
        <div id="portal-nav" class="d-flex align-items-center"></div>
      </div>
    </div>
  </header>

  <main class="py-5" style="margin-top:80px">
    <div class="container" style="max-width:960px">
      <h2 class="mb-4">Admin</h2>
      <div id="alert-box"></div>

      <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" data-tab="doctors">Doctors</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="appointments">All appointments</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="notifications">Failed notifications</button></li>
      </ul>

      <div id="tab-doctors">
        <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#newDoctorModal">+ New doctor</button>
        <div id="doctor-list"></div>
      </div>

      <div id="tab-appointments" class="d-none">
        <div id="appt-list"></div>
      </div>

      <div id="tab-notifications" class="d-none">
        <div id="notif-list"></div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="newDoctorModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">New doctor</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div id="new-doctor-alert"></div>
          <div class="row g-2">
            <div class="col-6"><input id="nd-name" class="form-control" placeholder="Full name"></div>
            <div class="col-6"><input id="nd-email" class="form-control" placeholder="Email"></div>
            <div class="col-6"><input id="nd-password" type="password" class="form-control" placeholder="Temporary password (min 8)"></div>
            <div class="col-6"><input id="nd-specialization" class="form-control" placeholder="Specialization"></div>
            <div class="col-4"><input id="nd-slot" type="number" class="form-control" placeholder="Slot minutes" value="30"></div>
          </div>
          <hr>
          <p class="small text-muted mb-1">Working hours</p>
          <div id="nd-hours"></div>
        </div>
        <div class="modal-footer"><button id="create-doctor-btn" class="btn btn-primary">Create</button></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="leaveModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Mark leave day</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div id="leave-alert"></div>
          <input type="date" id="leave-date" class="form-control mb-2">
          <input id="leave-reason" class="form-control" placeholder="Reason (optional)">
        </div>
        <div class="modal-footer"><button id="save-leave-btn" class="btn btn-primary">Save leave</button></div>
      </div>
    </div>
  </div>

  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    requireRole('ADMIN');
    renderNav();
    const alertBox = document.getElementById('alert-box');
    const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    let leaveTargetDoctorId = null;

    document.getElementById('nd-hours').innerHTML = DAYS.map((d, i) => `
      <div class="row g-2 mb-1 align-items-center">
        <div class="col-2"><input type="checkbox" class="form-check-input day-toggle" data-day="${i}"> ${d}</div>
        <div class="col-4"><input type="time" class="form-control form-control-sm day-start" data-day="${i}" value="09:00"></div>
        <div class="col-4"><input type="time" class="form-control form-control-sm day-end" data-day="${i}" value="17:00"></div>
      </div>`).join('');

    document.querySelectorAll('[data-tab]').forEach((btn) => btn.addEventListener('click', () => {
      document.querySelectorAll('[data-tab]').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      ['doctors', 'appointments', 'notifications'].forEach((t) => document.getElementById(`tab-${t}`).classList.toggle('d-none', t !== btn.dataset.tab));
      if (btn.dataset.tab === 'appointments') loadAppointments();
      if (btn.dataset.tab === 'notifications') loadNotifications();
    }));

    async function loadDoctors() {
      const doctors = await api('/api/admin/doctors');
      document.getElementById('doctor-list').innerHTML = doctors.map((d) => `
        <div class="card mb-3"><div class="card-body">
          <div class="d-flex justify-content-between">
            <h5>${escapeHtml(d.user.name)} — ${escapeHtml(d.specialization)}</h5>
            <button class="btn btn-sm btn-outline-warning" onclick="openLeave('${d.id}')">Mark leave</button>
          </div>
          <p class="small text-muted mb-1">${escapeHtml(d.user.email)} &middot; ${d.slotDurationMinutes} min slots</p>
          <p class="small mb-1">${d.workingHours.map((wh) => `${DAYS[wh.dayOfWeek]} ${wh.startTime}-${wh.endTime}`).join(', ') || 'No working hours set'}</p>
          ${d.leaves.length ? `<p class="small text-warning mb-0">Leave: ${d.leaves.map((l) => l.date.slice(0,10)).join(', ')}</p>` : ''}
        </div></div>`).join('') || '<p class="text-muted">No doctors yet.</p>';
    }

    document.getElementById('create-doctor-btn').addEventListener('click', async () => {
      const modalAlert = document.getElementById('new-doctor-alert');
      const workingHours = [...document.querySelectorAll('.day-toggle')]
        .filter((cb) => cb.checked)
        .map((cb) => ({
          dayOfWeek: Number(cb.dataset.day),
          startTime: document.querySelector(`.day-start[data-day="${cb.dataset.day}"]`).value,
          endTime: document.querySelector(`.day-end[data-day="${cb.dataset.day}"]`).value,
        }));

      try {
        await api('/api/admin/doctors', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('nd-name').value,
            email: document.getElementById('nd-email').value,
            password: document.getElementById('nd-password').value,
            specialization: document.getElementById('nd-specialization').value,
            slotDurationMinutes: Number(document.getElementById('nd-slot').value) || 30,
            workingHours,
          }),
        });
        bootstrap.Modal.getInstance(document.getElementById('newDoctorModal')).hide();
        loadDoctors();
      } catch (err) {
        showAlert(modalAlert, err.message);
      }
    });

    function openLeave(doctorId) {
      leaveTargetDoctorId = doctorId;
      document.getElementById('leave-alert').innerHTML = '';
      document.getElementById('leave-date').value = '';
      document.getElementById('leave-reason').value = '';
      new bootstrap.Modal(document.getElementById('leaveModal')).show();
    }
    window.openLeave = openLeave;

    document.getElementById('save-leave-btn').addEventListener('click', async () => {
      const leaveAlert = document.getElementById('leave-alert');
      const date = document.getElementById('leave-date').value;
      if (!date) return showAlert(leaveAlert, 'Pick a date.');
      try {
        const result = await api(`/api/admin/doctors/${leaveTargetDoctorId}/leave`, {
          method: 'POST',
          body: JSON.stringify({ date, reason: document.getElementById('leave-reason').value || undefined }),
        });
        bootstrap.Modal.getInstance(document.getElementById('leaveModal')).hide();
        showAlert(alertBox, `Leave recorded. ${result.cancelledAppointments} appointment(s) cancelled, ${result.patientsNotified} patient(s) notified, ${result.notificationsFailed} notification(s) failed.`, result.notificationsFailed > 0 ? 'warning' : 'success');
        loadDoctors();
      } catch (err) {
        showAlert(leaveAlert, err.message);
      }
    });

    async function loadAppointments() {
      const appointments = await api('/api/admin/appointments');
      document.getElementById('appt-list').innerHTML = `
        <table class="table table-sm"><thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Doctor</th><th>Status</th></tr></thead><tbody>
        ${appointments.map((a) => `<tr>
          <td>${a.date.slice(0,10)}</td><td>${a.startTime}</td>
          <td>${escapeHtml(a.patient.name)}</td>
          <td>${escapeHtml(a.doctor.user.name)}</td>
          <td>${a.status}</td>
        </tr>`).join('')}
        </tbody></table>` || '<p class="text-muted">No appointments.</p>';
    }

    async function loadNotifications() {
      const logs = await api('/api/admin/notifications?failed=true');
      document.getElementById('notif-list').innerHTML = logs.length ? `
        <table class="table table-sm"><thead><tr><th>To</th><th>Type</th><th>Status</th><th>Retries</th><th>Last error</th></tr></thead><tbody>
        ${logs.map((l) => `<tr>
          <td>${escapeHtml(l.recipient)}</td><td>${l.type}</td>
          <td><span class="badge bg-${l.status === 'PERMANENTLY_FAILED' ? 'danger' : 'warning'}">${l.status}</span></td>
          <td>${l.retryCount}/${l.maxRetries}</td>
          <td class="small">${escapeHtml(l.lastError || '')}</td>
        </tr>`).join('')}
        </tbody></table>` : '<p class="text-muted">No failed notifications.</p>';
    }

    loadDoctors().catch((err) => showAlert(alertBox, err.message));
  </script>
</body>
</html>
