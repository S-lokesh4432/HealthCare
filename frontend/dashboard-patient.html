<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>My Appointments - Clinic</title>
  <link href="assets/img/favicon.png" rel="icon">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
  <link href="assets/css/portal.css" rel="stylesheet">
</head>
<body class="portal-body">
  <div id="portal-nav"></div>
  <div id="heading"></div>

  <main class="portal-main">
    <div class="container" style="max-width:860px">
      <div id="alert-box"></div>
      <div id="stats" class="portal-stats d-none"></div>
      <div id="list"></div>
    </div>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/portal.js"></script>
  <script>
    const user = requireRole('PATIENT');
    renderPortalNav();
    document.getElementById('heading').innerHTML = pageHeading(
      `Hello, ${cleanName(user.name).split(' ')[0]}`,
      'Your upcoming visits, summaries and prescriptions.',
      `<a href="book.html" class="btn btn-outline-light"><i class="bi bi-plus-lg me-1"></i> Book appointment</a>
       <button id="calendar-btn" class="btn btn-outline-light ms-2"><i class="bi bi-calendar-plus me-1"></i> Google Calendar</button>`
    );

    const alertBox = document.getElementById('alert-box');
    const listEl = document.getElementById('list');

    function appointmentCard(a) {
      const summary = a.postVisitSummary;
      const rx = a.prescriptions || [];

      return `<div class="portal-card portal-card-hover">
        <div class="portal-card-body">
          <div class="d-flex align-items-start gap-3">
            ${avatar(a.doctorName, 'portal-avatar-lg')}
            <div class="flex-grow-1 min-w-0">
              <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                <div>
                  <h3 class="portal-card-title">${escapeHtml(cleanName(a.doctorName))}</h3>
                  <div class="portal-meta">${escapeHtml(a.doctor.specialization)}</div>
                </div>
                ${statusPill(a.status)}
              </div>

              <div class="portal-meta mt-2">
                <i class="bi bi-calendar3"></i>${prettyDate(a.date)}
                <span class="ms-3"><i class="bi bi-clock"></i>${prettyTime(a.startTime)} – ${prettyTime(a.endTime)}</span>
              </div>

              ${a.preVisitStatus === 'FAILED' && a.status !== 'COMPLETED'
                ? `<div class="ai-unavailable mt-3"><i class="bi bi-exclamation-triangle me-1"></i>AI summary unavailable for this visit — your doctor will review your notes directly.</div>`
                : ''}

              ${summary ? `
                <div class="ai-block mt-3">
                  <h6><i class="bi bi-journal-medical me-1"></i>Visit summary</h6>
                  <p class="mb-0" style="font-size:14.5px">${escapeHtml(summary.summary)}</p>
                  ${summary.medicationSchedule?.length ? `
                    <h6 class="mt-3">Medication</h6>
                    <ul>${summary.medicationSchedule.map((m) => `<li><strong>${escapeHtml(m.medication)}</strong> — ${escapeHtml(m.schedule)}</li>`).join('')}</ul>` : ''}
                  ${summary.followUpSteps?.length ? `
                    <h6 class="mt-3">Next steps</h6>
                    <ul>${summary.followUpSteps.map((s) => `<li>${escapeHtml(s)}</li>`).join('')}</ul>` : ''}
                </div>` : ''}

              ${a.postVisitStatus === 'FAILED' ? `<div class="ai-unavailable mt-3"><i class="bi bi-exclamation-triangle me-1"></i>Visit summary unavailable — please contact the clinic for details.</div>` : ''}

              ${rx.length ? `<div class="mt-3 d-flex flex-wrap gap-2">
                ${rx.map((p) => `<span class="portal-pill pill-purple"><i class="bi bi-capsule"></i>${escapeHtml(p.medicationName)} ${escapeHtml(p.dosage)}</span>`).join('')}
              </div>` : ''}

              ${a.status === 'CONFIRMED' ? `
                <button class="btn btn-sm btn-outline-danger mt-3" data-cancel="${a.id}">
                  <i class="bi bi-x-circle me-1"></i>Cancel appointment
                </button>` : ''}
            </div>
          </div>
        </div>
      </div>`;
    }

    async function load() {
      listEl.innerHTML = skeletonCards(2);
      const all = await api('/api/appointments/mine');

      if (all.length === 0) {
        document.getElementById('stats').classList.add('d-none');
        listEl.innerHTML = emptyState('bi-calendar-heart', 'You have no appointments yet.',
          '<a href="book.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Book your first appointment</a>');
        return;
      }

      const active = ['CONFIRMED', 'HELD'];
      const upcoming = all.filter((a) => active.includes(a.status));
      const past = all.filter((a) => !active.includes(a.status));

      document.getElementById('stats').classList.remove('d-none');
      document.getElementById('stats').innerHTML = [
        ['bi-calendar-check', upcoming.length, 'Upcoming'],
        ['bi-clipboard2-check', all.filter((a) => a.status === 'COMPLETED').length, 'Completed'],
        ['bi-capsule', all.reduce((n, a) => n + (a.prescriptions?.length || 0), 0), 'Prescriptions'],
      ].map(([icon, value, label]) => `
        <div class="portal-stat d-flex align-items-center gap-3">
          <div class="portal-stat-icon"><i class="bi ${icon}"></i></div>
          <div><div class="portal-stat-value">${value}</div><div class="portal-stat-label">${label}</div></div>
        </div>`).join('');

      listEl.innerHTML = `
        ${upcoming.length ? `<h2 class="portal-card-title mb-3" style="font-size:15px;text-transform:uppercase;letter-spacing:.5px;color:var(--portal-muted)">Upcoming</h2>
          ${upcoming.map(appointmentCard).join('')}` : ''}
        ${past.length ? `<h2 class="portal-card-title mb-3 mt-4" style="font-size:15px;text-transform:uppercase;letter-spacing:.5px;color:var(--portal-muted)">History</h2>
          ${past.map(appointmentCard).join('')}` : ''}`;

      listEl.querySelectorAll('[data-cancel]').forEach((btn) =>
        btn.addEventListener('click', () => cancelAppointment(btn.dataset.cancel)));
    }

    async function cancelAppointment(id) {
      if (!confirm('Cancel this appointment?')) return;
      try {
        await api(`/api/appointments/${id}/cancel`, { method: 'POST' });
        load();
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    }

    document.getElementById('calendar-btn').addEventListener('click', async () => {
      try {
        const { url } = await api('/api/calendar/connect');
        window.open(url, '_blank');
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    });

    load().catch((err) => {
      listEl.innerHTML = '';
      showAlert(alertBox, err.message);
    });
  </script>
</body>
</html>
