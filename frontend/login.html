<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Log In - Clinic</title>
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
</head>
<body>
  <header class="header fixed-top" style="position:relative">
    <div class="branding d-flex align-items-center py-3">
      <div class="container d-flex align-items-center justify-content-between">
        <a href="index.html" class="logo d-flex align-items-center"><h1 class="sitename">Clinic</h1></a>
        <nav>
          <a href="index.html" class="me-3">Home</a>
          <a href="book.html" class="me-3">Book Appointment</a>
        </nav>
        <div id="portal-nav" class="d-flex align-items-center"></div>
      </div>
    </div>
  </header>

  <main class="py-5" style="margin-top:80px">
    <div class="container" style="max-width:420px">
      <h2 class="mb-4">Log in</h2>
      <div id="alert-box"></div>
      <form id="login-form">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </form>
      <p class="mt-3 text-center">No account? <a href="register.html">Register</a></p>
      <div class="mt-4 p-3 bg-light rounded small">
        <strong>Demo accounts</strong> (password <code>Demo@1234</code>):<br>
        admin@demo.local &middot; dr.patel@demo.local &middot; dr.khan@demo.local &middot; dr.reyes@demo.local
      </div>
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script>
    renderNav();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alert-box');
      alertBox.innerHTML = '';
      const form = new FormData(e.target);

      try {
        const { token, user } = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email: form.get('email'), password: form.get('password') }),
        });
        setSession(token, user);
        const dest = { PATIENT: 'dashboard-patient.html', DOCTOR: 'dashboard-doctor.html', ADMIN: 'dashboard-admin.html' }[user.role];
        window.location.href = dest;
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    });
  </script>
</body>
</html>
